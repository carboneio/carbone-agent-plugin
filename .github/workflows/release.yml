name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.304

      - name: Validate
        run: node scripts/validate.mjs --require-claude

      - name: Check the tag matches the shared version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./plugin.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the shared version $VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "Tag $TAG matches version $VERSION"

      - name: Build carbone.skill and carbone-chatgpt-plugin.zip
        run: node scripts/build-zips.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/carbone.skill
            dist/carbone-chatgpt-plugin.zip
